# OmacVM: RTKit keeps PipeWire's sound threads real-time after the VM was
# stopped. RTKit's watchdog (its "canary") takes a stopped VM for a runaway
# real-time thread and demotes every one of them for the rest of the session:
# then PipeWire runs at normal priority and the sound breaks whenever the
# VM is busy. The kernel still limits real-time threads (RTKit's RLIMIT_RTTIME
# and the scheduler's fair server keep the desktop running).
[Service]
ExecStart=
ExecStart=/usr/lib/rtkit-daemon --no-canary
