# From try-omarchy (github.com/omacom/try-omarchy), MIT, renamed for OmacVM.
# DKMS passes KERNELRELEASE on make's command line, which picks the Makefile's
# kbuild branch: drive kbuild directly.
PACKAGE_NAME="omacvm-battery"
PACKAGE_VERSION="1.1.0"
BUILT_MODULE_NAME[0]="omacvm_battery"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
