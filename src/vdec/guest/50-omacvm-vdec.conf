# OmacVM: WirePlumber leaves Chromium's video decoder (omacvm-vdec) alone.
# It is a V4L2 decoder, not a camera, and opens only while omacvm-vdecd is
# ready. WirePlumber 0.5 waits forever for a V4L2 device it cannot open and
# then links no sound at all (seen when the module came after WirePlumber,
# e.g. built by DKMS at the first boot of a new kernel).
# /etc/wireplumber/wireplumber.conf.d/, from src/vdec/guest/install.sh.
monitor.v4l2.rules = [
  {
    matches = [
      { device.bus-path = "platform-omacvm-vdec" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
