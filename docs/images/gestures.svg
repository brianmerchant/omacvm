<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.3286;0.35;0.6714;0.6929;1" values="0;0;1;1;0;0"/><text x="500" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e0def4" text-anchor="middle" letter-spacing="0.3">pinch to zoom</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.6714;0.6929;0.9786;1" values="0;0;1;1;0"/><text x="500" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e0def4" text-anchor="middle" letter-spacing="0.3">four fingers work too</text></g>
