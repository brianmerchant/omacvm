<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d">
<title id="t">Trackpad gestures</title>
<desc id="d">Animated diagram. Left: a Mac trackpad; right: Omarchy full screen in the VM. Three fingers swipe left on the trackpad twice and Omarchy's workspaces slide from 1 to 2 to 3, the bar's workspace indicator following. Then two fingers pinch outwards and the web page in the browser on workspace 3 zooms in, and pinch back in. Finally four fingers swipe right twice and the workspaces slide back to 1. The trackpad's touches are replayed on a virtual Apple touchpad in the VM, where Hyprland turns them into gestures; this happens while the VM is full screen, and Control+Option+Command+Escape hands the trackpad back to macOS.</desc>

<defs><pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><rect x="20" y="20" width="2" height="2" fill="#26233a"/></pattern></defs><rect width="1000" height="470" fill="#191724"/><rect width="1000" height="470" fill="url(#dots)"/>
