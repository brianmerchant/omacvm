<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 706" width="1000" height="706" role="img" aria-labelledby="t d">
<title id="t">GPU speed of one Omarchy VM in each OmacVM.app release, against the oldest release measured</title>
<desc id="d">OpenGL in the VM (glmark2, 3 s per scene, score): 2.7.0 1.00x (764), 2.8.0 1.00x (764), 2.9.1 1.93x (1,472), 3.0.0 2.39x (1,827), 3.0.3 2.38x (1,817). Browser graphics (WebGL Aquarium, 30,000 fish, fps): 2.7.0 1.00x (17.4 fps), 2.8.0 0.86x (15.0 fps), 2.9.1 0.87x (15.1 fps), 3.0.0 0.63x (11.0 fps), 3.0.3 1.07x (18.7 fps). Browser overall (Basemark Web 3.0, one run each, score): 2.7.0 1.00x (1,469), 2.8.0 0.93x (1,359), 2.9.1 0.88x (1,286), 3.0.0 0.90x (1,326), 3.0.3 1.05x (1,536). Vulkan in the VM (vkmark, Graphics set to Vulkan, score): 2.7.0 no Vulkan setting, 2.8.0 no Vulkan setting, 2.9.1 not tested: only a hidden Vulkan flag, 3.0.0 skipped: no picture at start on M1/M2 (#161, fixed in 3.0.1), 3.0.3 821, the only version measured. Each test as a multiple of its oldest version measured (1x); median of 3 runs unless noted.</desc>
